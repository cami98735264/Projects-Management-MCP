[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm-scheduling-mcp"
version = "0.1.0"
description = "MCP server exposing a deterministic CPM / PERT / Gantt / crashing engine that produces auditable XLSX solutions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.20,<2",
    "pydantic>=2.7",
    "xlsxwriter>=3.1",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
    "networkx>=3.2",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10", "pillow>=10"]
pdf = ["pypdf>=4"]
dev = ["pytest>=8", "scipy>=1.11"]

[project.scripts]
pm-scheduling-mcp = "pm_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pm_mcp = ["reference/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
